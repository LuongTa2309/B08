name: RTL Simulation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog

    - name: Run Simulation
      run: |
        cd "BO_CAI_DAT_SINH_VIEN/src"
        iverilog -o sim.vvp rtl.v testbench.v
        vvp sim.vvp
