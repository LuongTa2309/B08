name: RTL Simulation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog

    - name: Run official testbench
      run: |
        cd BO_CAI_DAT_SINH_VIEN/b08_mux_demux
        iverilog -g2012 -o sim.vvp rtl/b08_mux_demux.v tb/b08_reference.sv tb/b08_tb.sv
        vvp sim.vvp | tee log.txt
       - name: Run official testbench
      run: |
        cd BO_CAI_DAT_SINH_VIEN/b08_mux_demux
        iverilog -g2012 -o sim.vvp rtl/b08_mux_demux.v tb/b08_reference.sv tb/b08_tb.sv
        vvp sim.vvp | tee log.txt
        grep -q "Mophong thanh cong!" log.txt
